[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-docx"
version = "1.0.1"
description = "A read-only DOCX package and XML explorer"
readme = "xray_docx/README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xray-docx = "xray_docx.cli:main"

[tool.setuptools.packages.find]
include = ["xray_docx*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
