name: Verify DOCX Ray
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Check Python version
        run: python3 --version
      - name: Install code quality tool
        run: python3 -m pip install -r requirements-dev.txt
      - name: Code standards
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .
      - name: CLI, security and static-server regression tests
        run: python3 -m unittest discover -v
      - name: JavaScript syntax
        run: node --check public/app.js
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Browser SDK and UI integration tests
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real-browser upload, inspection, cancellation and download tests
        run: npm run test:e2e
      - name: Keep synthetic browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Python syntax
        run: python3 -m compileall -q xray_docx scripts
