[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-ray"
version = "1.0.0"
description = "A read-only DOCX package and XML explorer"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
docx-ray = "docx_ray.cli:main"

[tool.setuptools.packages.find]
include = ["docx_ray*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
